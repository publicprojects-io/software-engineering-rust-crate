# Keep mutation runs bounded and focused on production formulas.
profile = "mutants"
timeout_multiplier = 3.0
minimum_test_timeout = 10.0
exclude_globs = ["examples/**", "benches/**"]
# Multiplication and division by the documented minor weight (1.0) are
# mathematically identical, so this generated mutant cannot be distinguished.
exclude_re = ['replace \* with / in severity_weighted_escaped_defect_score']
